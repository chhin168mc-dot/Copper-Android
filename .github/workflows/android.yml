name: Android CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      # Release APKs are built on every branch of the main repo (not for pull requests, they don't get secrets)
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_release_next.jks
          fi

      # The Google Play upload key is only needed where the .aab is published
      - name: Decode upload keystore
        if: vars.PUBLISH_GPLAY == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_upload_next.jks
          fi

      - name: Build Publishing .aab
        if: vars.PUBLISH_GPLAY == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Release .apk
        if: github.event_name != 'pull_request'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/Nokor-release.apk
          # Fail the release job if the generated APK is not cryptographically signed.
          APKSIGNER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs out/Nokor-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/Nokor-release.apk

      - name: Upload AAB
        if: vars.PUBLISH_GPLAY == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      # Only the default branch (or a v* tag) publishes the nightly release, other branches just upload the APK as an artifact
      - name: Release Nightly APK
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v3
        with:
          name: Nokor Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Nokor nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/Nokor-release.apk

      # The APK goes to Backblaze B2, then the Wispbyte API is told about it and stores the release in Supabase.
      # "version_code" is the run number, the same number that is the versionCode of the build.
      - name: Upload APK to Backblaze B2
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          KEY="releases/${{ github.run_number }}/Nokor-release.apk"
          aws s3 cp out/Nokor-release.apk "s3://${B2_BUCKET}/${KEY}" \
            --endpoint-url "${B2_ENDPOINT}" \
            --content-type application/vnd.android.package-archive
          echo "B2_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Register release in the update API
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          API_URL: ${{ secrets.UPDATE_API_URL }}
          ADMIN_TOKEN: ${{ secrets.UPDATE_ADMIN_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SIZE="$(stat -c %s out/Nokor-release.apk)"
          SHA="$(sha256sum out/Nokor-release.apk | cut -d' ' -f1)"
          jq -n \
            --argjson code "${{ github.run_number }}" \
            --arg name "2026.1.1 (build ${{ github.run_number }})" \
            --arg key "$B2_KEY" \
            --argjson size "$SIZE" \
            --arg sha "$SHA" \
            --arg log "${COMMIT_MSG:-Nokor nightly build}" \
            --arg commit "${{ github.sha }}" \
            '{version_code: $code, version_name: $name, channel: "release", arch: "all",
              file_key: $key, file_name: "Nokor-release.apk", size_bytes: $size, sha256: $sha,
              changelog: $log, commit_sha: $commit}' > release.json
          cat release.json
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 -X POST "${API_URL%/}/api/v1/admin/releases" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @release.json

      # The update files: only what changed between this build and the last builds, so the launcher downloads
      # a few MB instead of the whole APK. A failure here never stops the release, the apps then download the
      # whole APK as before.
      - name: Build and register the update files (only the changed parts)
        continue-on-error: true
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          API_URL: ${{ secrets.UPDATE_API_URL }}
          ADMIN_TOKEN: ${{ secrets.UPDATE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          CODE="${{ github.run_number }}"
          # The last 3 builds before this one, so apps that skipped a build get an update file too
          PREVIOUS="$(curl --fail --silent --show-error --max-time 60 "${API_URL%/}/api/v1/admin/releases" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            | jq -r --argjson code "$CODE" \
                '[.[] | select(.channel == "release" and .is_active and (.version_code | tonumber) < $code)]
                 | sort_by(.version_code | tonumber) | reverse | .[0:3] | .[].version_code')"
          if [ -z "$PREVIOUS" ]; then echo "No earlier build, nothing to compare with"; exit 0; fi
          NEW_SIZE="$(stat -c %s out/Nokor-release.apk)"
          for FROM in $PREVIOUS; do
            echo "=== from build $FROM ==="
            # The APK of the earlier build is in B2 under the key of the upload step
            if ! aws s3 cp "s3://${B2_BUCKET}/releases/${FROM}/Nokor-release.apk" prev.apk \
                 --endpoint-url "${B2_ENDPOINT}" --only-show-errors; then
              echo "The APK of build $FROM is not in B2, skipped"; continue
            fi
            python3 tools/make_delta.py prev.apk out/Nokor-release.apk "out/from-${FROM}.delta" --meta delta.json
            rm -f prev.apk
            if [ "$(jq -r .worth_it delta.json)" != "true" ]; then
              echo "The update file is not much smaller than the APK, skipped"; continue
            fi
            KEY="releases/${CODE}/from-${FROM}.delta"
            aws s3 cp "out/from-${FROM}.delta" "s3://${B2_BUCKET}/${KEY}" \
              --endpoint-url "${B2_ENDPOINT}" --content-type application/octet-stream
            jq -n \
              --argjson code "$CODE" --argjson from "$FROM" --arg key "$KEY" --arg name "from-${FROM}.delta" \
              --slurpfile meta delta.json \
              '{version_code: $code, from_code: $from, channel: "release", arch: "all",
                file_key: $key, file_name: $name,
                size_bytes: $meta[0].delta_size, sha256: $meta[0].delta_sha256,
                base_sha256: $meta[0].base_sha256, base_size: $meta[0].base_size}' > delta-request.json
            curl --fail-with-body --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
              --max-time 60 -X POST "${API_URL%/}/api/v1/admin/deltas" \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @delta-request.json
            echo
          done

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: vars.PUBLISH_GPLAY == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.nokorlauncher.mc
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
